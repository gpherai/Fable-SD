        completed_at: '2026-10-03T12:44:04.475Z'
      - id: zryyx5zdbsjv6vlldp8b3zxq
        text: 'Polish effecten en performance (komt NA de visuals-todo, want die vervangt de modellen in Body.gd/Props.gd). Meting 2026-10-03 (--perf, zie .project/notes.md): MSAA ~10 ms, SSAO 3-6 ms, schaduwen verdubbelen de draw calls, ~40 losse meshes per mens/vijand; gras is niet het knelpunt (grasmesh-culling pas als een meting dat zegt). Gerald zag bij echt spelen met alles uit geen haperingen. (1) quality ''low'' zet nu alleen gras en zonneschaduw terug: ook MSAA/SSAO uit. (2) Effects.ring/wedge/bolt/sparks maken per aanroep nieuwe mesh+materiaal+tween: hergebruiken; slag-trails, hit-stop, lichte camerashake. (3) Modellen samenvoegen/delen, schaduwafstand. (4) physics-interpolatie aanzetten (gen_project.py) tegen camera-schokjes op 120/144 Hz, dan reset_physics_interpolation() bij teleports. (5) ObjectDB-leak bij afsluiten (statische Props-materiaalcache) opruimen als het stoort. Voor/na-vergelijking met --perf direct na elkaar op een rustige machine.'
        status: open
        stage: plan
        priority: P4
        created_by: claude-code
