  - id: gxhi6g7choc0akjym2xq4phy
    title: MVP speelbaar
    todos:
      - id: h3gontwedr1htgu8026b46vh
        text: 'MVP stap 1: entity-scripts schrijven zodat het project compileert: res://scripts/entities/{Player,NPC,Enemy,Projectile}.gd (Player = beweging, camera, input) en res://scripts/combat/Effects.gd. World.gd preloadt ze al maar ze zijn nooit geschreven (de cloud-sessie meldde zelf dat Player Controller/Combat/AI/UI nog open staan). Doel: tools/check.sh groen (nu scripts=1 broken) en Main.tscn startbaar.'
        status: completed
        stage: implement
        priority: P1
        created_by: claude-code
        tags:
          - mvp
          - player
          - gdscript
        initiative: speelbare-mvp
        created_at: '2026-10-03T08:24:25.303Z'
        updated_at: '2026-10-03T09:58:24.802Z'
        completed_at: '2026-10-03T09:58:24.802Z'
      - id: r0kqhh78w3k0gkwfmvdguczx
        text: 'MVP stap 2: combat-gameplay en NPC/Enemy-AI op basis van data/enemies.json en data/moves.json. Stap 1 levert de haken: Enemy._think(delta) is leeg (vijanden staan stil), Enemy.take_damage(amount, source, element) en die() werken al, Player.take_damage(amount, source) bestaat, Projectile meldt contact via cfg.on_hit. Nog te doen: speler-aanval (LMB/J, Sankhala-combo, Mahaprahara laden), blokkeren/Pratiprahara, boog/chakra, doel vergrendelen, siddhi''s 1-6, knockback, combat_mult (Yuddha Guna) ophogen, vijand-AI (patrouille, agro, aanvalstiming, ranged/caster/summoner/boss-abilities, flying, pack, leap, teleport) en ally-gedrag. Let op: nonlethal-vijanden (marmara_*) worden nu gewoon gedood.'
        status: completed
        stage: implement
        priority: P1
        created_by: claude-code
        tags:
          - mvp
          - combat
          - ai
        initiative: speelbare-mvp
        blocked_by:
          - h3gontwedr1htgu8026b46vh
        created_at: '2026-10-03T08:45:19.744Z'
        updated_at: '2026-10-03T10:27:52.421Z'
        completed_at: '2026-10-03T10:27:52.421Z'
      - id: tsbkjce6gi6c40qo484mhqva
        text: 'Stap 2 afronden (volgorde): (1) `--combat-shot` draaien op de host (Wayland: XDG_RUNTIME_DIR=/run/user/1000 WAYLAND_DISPLAY=wayland-0) en screenshots/combat_1.png + combat_2.png bekijken (zwaardstand na zwaai, telegraaf-flits, hp-balkjes, lock-marker); (2) samen proefspelen met echte muis/toetsen (combo, charge, parry-venster 0,25 s, boog-richten, Tab-lock, siddhi 1-6); (3) balans tunen (speler-hp 100 tegenover vijand-dmg tot 90, multiplier-cap 10); (4) Dhyana (H), drankjes (R/T), Mushti-bala-tapas bouwen; (5) Marmara-duel (nonlethal) in de praktijk testen.'
        status: completed
        stage: review
        priority: P1
        created_by: claude-code
        tags:
          - mvp
          - combat
          - polish
        initiative: speelbare-mvp
        created_at: '2026-10-03T10:28:07.157Z'
        updated_at: '2026-10-03T11:07:12.935Z'
        completed_at: '2026-10-03T11:07:12.935Z'
      - id: i4zg75uybr1o5xgzdrnbd712
        text: 'MVP stap 3: UI-systeem (health/mana-HUD, inventory, quest log, equipment-menu) plus hoofdmenu en pauzemenu. Stap 1 levert: tijdelijke DebugOverlay (scripts/ui/DebugOverlay.gd, vervangen door de echte HUD), Main.gd start nu direct een nieuw spel (vervangen door hoofdmenu), Esc maakt alleen de muis vrij (pauzemenu ontbreekt). Events die de UI moet afhandelen en nu nergens aankomen: panel_requested ("death", "map", "shop", "trainer", "shrine", "yaksha", "boasts", "marmara_choice", "sadhana", "gift"), dialogue_started (NPC.interact), cutscene_requested, notify, interact_hint. Zonder "death"-paneel blijft de speler bevroren als hij sterft: dood-scherm met World.respawn_player() hoort hierbij. Regio-overgangen werken al (Interactable exit -> World.travel).'
        status: completed
        stage: implement
        priority: P1
        created_by: claude-code
        tags:
          - mvp
          - ui
          - menu
        initiative: speelbare-mvp
        blocked_by:
          - h3gontwedr1htgu8026b46vh
        created_at: '2026-10-03T08:45:21.180Z'
        updated_at: '2026-10-03T11:38:00.992Z'
        completed_at: '2026-10-03T11:38:00.992Z'
      - id: fg3buv2w2ku8jxl5yv0dng5w
        text: 'Proefspelen met echte muis en toetsen (Gerald): alles uit de checklist in CLAUDE.md (''Proefspel-checklist'') doorlopen op de host en opschrijven wat raar voelt: combo en geladen slag, parry-venster 0,25 s, Tab-lock en camera, boog richten, siddhi 1-6, Dhyana (H), drankjes (R/T), vuistgevecht, Marmara-duel. Sinds stap 3 ook de interface: hoofdmenu en nieuw spel, Esc-pauze, I/Q/P/O/X/M/C-panelen, dialoog met E (Spatie/Enter/E = verder, cijfers kiezen), winkel kopen/verkopen, dood-scherm, F5/F9, instellingen. Kijk of muis vrij/vast goed wisselt, of aanvallen niet per ongeluk bij een menuklik gebeuren en of de teksten prettig lezen. Bevindingen worden nieuwe todo''s of tuning-aanpassingen (balans: `--balance`).'
        status: open
        stage: review
        priority: P2
        created_by: claude-code
